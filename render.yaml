# FREE TESTING ONLY: no paid instance, disk, database, or background worker.
# Sessions and encrypted connections may be lost on sleep, restart, or redeploy.
# All credentials are set privately in Render, never in Git or the frontend.
services:
  - type: web
    name: bloom-instagram-backend
    runtime: node
    branch: arena/d3fb70ad-instagram-automation
    plan: free
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: ephemeral
      - key: DATABASE_PATH
        value: /tmp/bloom/bloom.sqlite
      - key: META_API_VERSION
        value: v26.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
# PUBLIC_BASE_URL defaults to Render's RENDER_EXTERNAL_URL. Set it manually if using a custom domain.
