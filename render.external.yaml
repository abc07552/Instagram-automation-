# Free Render compute with external PostgreSQL; no disk or paid Render database.
# Existing service: follow docs/EXTERNAL_DATABASE.md rather than creating a duplicate.
# Requires a database you create separately. Never put its URL in source control.
services:
  - type: web
    name: bloom-instagram-backend
    runtime: node
    branch: arena/d3fb70ad-instagram-automation
    plan: free
    buildCommand: npm ci --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: external
      - key: DATABASE_URL
        sync: false
      - key: META_API_VERSION
        value: v26.0
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_LOGIN_CONFIG_ID
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
# PUBLIC_BASE_URL defaults to Render's RENDER_EXTERNAL_URL. Set it manually if using a custom domain.
